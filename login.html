<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Campus Issue Reporting System – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #792117;
      --brand-hover: #5e1a12;
      --bg:          #ffffff;
      --card-bg:     #e8e8e8;
      --text:        #000000;
      --text-muted:  rgba(0,0,0,0.7);
      --input-bg:    #ffffff;
      --radius:      4px;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }

    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 130px;
    }
    .logo img { height: 110px; width: auto; object-fit: contain; }
    .site-title {
      font-size: 28px; font-weight: 700; color: var(--text);
      letter-spacing: -0.28px; line-height: 1.5; white-space: nowrap;
    }

    .nav-bar {
      background: var(--brand); height: 80px;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-bar h1 { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 1px; }

    .page-body {
      display: flex; justify-content: center;
      align-items: flex-start; padding: 60px 24px 80px;
    }

    .screen { width: 100%; display: flex; justify-content: center; }
    .card { background: var(--card-bg); width: 100%; max-width: 700px; border-radius: var(--radius); }

    #login-screen .card { padding: 50px 120px 60px; }


    .field-group { margin-bottom: 28px; }
    .field-group label {
      display: block; font-size: 22px; font-weight: 600;
      color: var(--text-muted); margin-bottom: 10px;
    }
    .field-group input {
      width: 100%; height: 60px; background: var(--input-bg);
      border: none; border-radius: var(--radius);
      padding: 0 16px; font-size: 16px;
    }

    .role-group { margin-bottom: 36px; }
    .role-options { display: flex; gap: 32px; }

    .actions { display: flex; flex-direction: column; align-items: center; gap: 18px; }

    .btn-primary {
      width: 260px; height: 55px; background: var(--brand);
      color: #fff; border: none; border-radius: var(--radius);
      font-size: 22px; font-weight: 700;
      cursor: pointer;
    }

    #success-screen { display: none; }
    #success-screen .card {
      padding: 80px 60px;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="logo">
    <img src="https://www.figma.com/api/mcp/asset/1b464af9-1993-446b-8ba3-0095453f08e6" />
  </div>
  <span class="site-title">Smart Campus Issue Reporting System</span>
</header>

<nav class="nav-bar"><h1>LOGIN</h1></nav>

<main class="page-body">

<!-- LOGIN SCREEN -->
<div id="login-screen" class="screen">
  <form method="POST">
  <div class="card">

    <div class="field-group">
      <label>Email</label>
      <input type="email" name="email" required />
    </div>

    <div class="field-group">
      <label>Password</label>
      <input type="password" name="password" required />
    </div>

    <div class="role-group">
      <div class="role-options">
        <label><input type="radio" name="role" value="student" checked> Student</label>
        <label><input type="radio" name="role" value="admin"> Admin</label>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" type="submit">Login</button>
      <p style="color:red;">{{ error }}</p>
    </div>

  </div>
  </form>
</div>

<!-- SUCCESS SCREEN -->
<div id="success-screen" class="screen">
  <div class="card">

    <h2>Login Successfully</h2>
    <p>Click OK to Enter the Dashboard</p>

    <!-- hidden role -->
    <input type="hidden" id="userRole" value="{{ role }}">

    <button class="btn-primary" onclick="goToDashboard()">OK</button>

  </div>
</div>

</main>

<script>
const loginSuccess = "{{ success }}";

if (loginSuccess === "true") {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('success-screen').style.display = 'flex';
}

function goToDashboard() {
  const role = document.getElementById("userRole").value.trim();

  if (role === "admin") {
    window.location.href = "/admin";
  } else {
    window.location.href = "/user";
  }
}
</script>

</body>
</html>
